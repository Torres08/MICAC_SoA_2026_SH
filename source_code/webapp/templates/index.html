<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ship Happens</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
<link rel="icon" type="image/png" href="/static/images/favicon.png">
<link rel="icon" type="image/x-icon" href="/static/images/favicon.ico">
</head>

<body>
<div class="overlay">

    <div class="container">

        <h1 class="title">
            Ship Happens
        </h1>

        <p class="subtitle">
            Analyze open-source repositories for vulnerable dependencies and zombie packages.
        </p>

        <div class="form-box">
            <input
                type="text"
                id="repoInput"
                placeholder="Enter GitHub Repository URL"
            >

            <button onclick="analyzeRepo()">
                Analyze Repository
            </button>
        </div>

        <div class="sample-repos" style="margin-top: 15px; font-size: 0.9em; text-align: center; color: rgba(255, 255, 255, 0.7);">
            Try a sample: 
            <a href="#" onclick="document.getElementById('repoInput').value='https://github.com/boto/boto3'; return false;" style="color: #4CAF50; text-decoration: underline; margin-left: 5px;">Boto3 (Healthy)</a> | 
            <a href="#" onclick="document.getElementById('repoInput').value='https://github.com/django/django'; return false;" style="color: #FFC107; text-decoration: underline; margin-left: 5px;">Django (Warning)</a> | 
            <a href="#" onclick="document.getElementById('repoInput').value='https://github.com/ansible/ansible'; return false;" style="color: #FF5252; text-decoration: underline; margin-left: 5px;">Ansible (Dangerous)</a> | 
            <a href="#" onclick="document.getElementById('repoInput').value='https://github.com/axios/axios'; return false;" style="color: #FF5252; text-decoration: underline; margin-left: 5px;">Axios (High Risk)</a>
        </div>


        <div id="dashboard" class="dashboard hidden">

    <div class="gauge-card">
        <h2>Repository Risk Score</h2>

     <div class="gauge">
        <div class="needle" id="needle"></div>

        <div class="gauge-cover">
            <span id="scoreValue">0</span>
            <small>/100</small>
        </div>
    </div>

        <p id="repoStatus" class="repo-status"></p>
    </div>

    <div class="summary-grid">
        <div class="summary-card">
            <h3>Total Dependencies</h3>
            <p id="totalDeps">0</p>
        </div>

        <div class="summary-card">
            <h3>Vulnerable Found</h3>
            <p id="vulnFound">0</p>
        </div>

        <div class="summary-card">
            <h3>Zombies Found</h3>
            <p id="zombiesFound">0</p>
        </div>
    </div>

</div>

<button id="downloadBtn" onclick="downloadJson()" style="display: none;">
    Download JSON Report
</button>

<div id="result" class="result-box"></div>
        </div>
        <button id="downloadBtn" onclick="downloadJson()" style="display: none;">
        Download JSON Report
        </button>

    </div>

</div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>
</html>
