# docker-compose.yml — mirrors setup.sh deployment exactly
#
# setup.sh equivalent:
#   scanner.service  → backend  (uvicorn api:app on :8000)
#   website.service  → frontend (gunicorn app:app on :5000)
#   nginx            → nginx    (reverse proxy on :80)
#
# Usage:
#   docker compose up --build -d       # start everything
#   docker compose logs -f             # stream all logs
#   docker compose down                # stop and remove containers

services:

  # ── scanner.service equivalent ────────────────────────────────────────────
  backend:
    build:
      context: ..                           # build context = source_code/
      dockerfile: deployment/Dockerfile.backend
    env_file:
      - ../../.env                          # GITHUB_TOKEN, ALLOWED_ORIGINS
    expose:
      - "8000"                              # internal only — Nginx proxies this
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ── website.service equivalent ────────────────────────────────────────────
  frontend:
    build:
      context: ..                           # build context = source_code/
      dockerfile: deployment/Dockerfile.frontend
    environment:
      # Point Flask at the backend container name (not 127.0.0.1)
      SCANNER_API: http://backend:8000/zombie-scan
    expose:
      - "5000"                              # internal only — Nginx proxies this
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # ── nginx equivalent ──────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"                           # HTTP (redirects to HTTPS)
      - "443:443"                           # HTTPS
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
