server {
    listen 80;
    server_name _;

    # Docker's internal DNS — re-resolve upstreams every 10 s
    # This prevents 502s after container rebuilds (new IP, stale nginx cache)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Frontend (Flask webapp)
    location / {
        set $frontend frontend:5000;
        proxy_pass         http://$frontend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 620s;
    }

    # Backend (FastAPI scanner)
    location /api/ {
        set $backend backend:8000;
        rewrite            ^/api/(.*)$ /$1 break;
        proxy_pass         http://$backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 620s;
    }
}